# API de __PROYECTO__ en __API__. El upstream lo cambia vps-deploy en cada despliegue (azul/verde).
upstream __PROYECTO___api {
    include /etc/nginx/upstreams/__PROYECTO__.conf;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API__;
    ssl_certificate __CERT__.pem;
    ssl_certificate_key __CERT__.key;
    include snippets/vps-tls.conf;
    include snippets/vps-cabeceras.conf;

    limit_req zone=general burst=40 nodelay;

    location / {
        proxy_pass http://__PROYECTO___api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Ajustes propios del proyecto, revisados por el admin (opcional).
    include /etc/nginx/vps-extra/__PROYECTO__-api*.conf;
}
