# www.__WEB__ redirige al dominio principal (solo cuando la web está en el dominio raíz).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__WEB__;
    ssl_certificate __CERT__.pem;
    ssl_certificate_key __CERT__.key;
    include snippets/vps-tls.conf;
    return 301 https://__WEB__$request_uri;
}
