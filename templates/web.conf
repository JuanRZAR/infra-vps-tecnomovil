# Web estática (SPA) de __PROYECTO__ en __WEB__. vps-new-project sustituye los __MARCADORES__.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WEB__;
    ssl_certificate __CERT__.pem;
    ssl_certificate_key __CERT__.key;
    include snippets/vps-tls.conf;
    include snippets/vps-cabeceras.conf;

    root /srv/apps/__PROYECTO__/web/current;
    index index.html;
    limit_req zone=general burst=40 nodelay;

    # Rutas de la SPA: lo que no es un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        include snippets/vps-cabeceras.conf;
        add_header Cache-Control "no-cache";
    }
    location = /assets/config.json {
        include snippets/vps-cabeceras.conf;
        add_header Cache-Control "no-cache";
    }
    # Archivos con hash en el nombre: no cambian nunca. Entre comillas por las llaves de {8,}.
    location ~* "-[A-Za-z0-9_]{8,}\.(js|css|woff2?)$" {
        include snippets/vps-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|woff2?|png|jpe?g|webp|svg|ico|json)$ {
        include snippets/vps-cabeceras.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Ajustes propios del proyecto, revisados por el admin (opcional).
    include /etc/nginx/vps-extra/__PROYECTO__-web*.conf;
}
