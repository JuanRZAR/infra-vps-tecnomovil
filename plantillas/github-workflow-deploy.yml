# Plantilla agnóstica (plantillas/README.md). Va en tu proyecto como .github/workflows/deploy.yml.
# Flujo: Pruebas -> Imagen (vps-check, hadolint, build, Trivy, prueba de consumo) -> Desplegar -> aviso si falla.
# En un PR solo se prueba; con merge a main, además se publica y se despliega (guia/03-subir-proyecto.md, 3.4).
name: Desplegar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # OPCIONAL: base real para tus pruebas
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pruebas
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # <PASOS_DE_PRUEBA>: tabla 2.4 (setup del lenguaje + instalar dependencias + ejecutar pruebas).
      # Si tienes web estática: compílala y súbela con actions/upload-artifact como artefacto "web".

  vps:
    needs: pruebas
    uses: JuanRZAR/infra-vps-tecnomovil/.github/workflows/deploy.yml@v1    # FIJO
    with:
      proyecto: <TU_PROYECTO>                       # el nombre en projects.yml
      dockerfile: <RUTA>/Dockerfile
      contexto: <RUTA>
      # web: web                                    # OPCIONAL: solo si tienes web estática
      # imagenes: |                                 # OPCIONAL: servicios internos (guia 2.0): nombre dockerfile contexto
      #   api backend/Dockerfile backend
      # env_prueba: |                               # OPCIONAL: variables SIN secretos para arrancar en la prueba de consumo
      #   SECRET_KEY=prueba-ci
      url_salud: https://<DOMINIO_API>/health
      desplegar: ${{ github.event_name != 'pull_request' }}                   # FIJO
    secrets:                                        # FIJO: uno por uno (secrets: inherit no funciona entre cuentas)
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
